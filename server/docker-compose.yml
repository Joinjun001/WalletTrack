# 실행: cd server && cp .env.example .env (값 채우기) && docker compose up -d --build
# - 서버에 이미 nginx가 있으면: api는 127.0.0.1:8080에만 열리고, nginx가 도메인 요청을 넘겨준다 (README 참고)
# - 80/443을 쓰는 웹 서버가 없으면: docker compose --profile caddy up -d --build (Caddy가 HTTPS까지 처리)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallettrack
      POSTGRES_USER: wallettrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallettrack -d wallettrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 외부에 포트를 열지 않는다 (collector/api만 내부 네트워크로 접근)

  collector:
    build: { context: .., dockerfile: server/Dockerfile }
    command: ["node", "src/collector.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://wallettrack:${POSTGRES_PASSWORD}@db:5432/wallettrack
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: server/Dockerfile }
    command: ["node", "src/api.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://wallettrack:${POSTGRES_PASSWORD}@db:5432/wallettrack
      API_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080" # 이 서버 안에서만 접근 (nginx 리버스 프록시용)
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
