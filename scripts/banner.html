<!doctype html>
<!-- README 배너 원본. npm run screenshots가 image/banner.png로 찍는다 (1280×360, 2배 해상도) -->
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1280px; height: 360px; overflow: hidden; font-family: 'Outfit', sans-serif; }
  .banner {
    position: relative; width: 100%; height: 100%; padding: 0 88px;
    display: flex; align-items: center; gap: 56px;
    background: radial-gradient(ellipse 60% 90% at 22% 50%, rgba(123, 140, 255, 0.22), transparent 70%),
                linear-gradient(135deg, #0B1020 0%, #07090E 60%, #0E131F 100%);
    color: #F0F4F8;
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .candles { position: absolute; right: 60px; bottom: 0; opacity: .16; }
  .whale { position: relative; width: 240px; height: 240px; flex-shrink: 0; filter: drop-shadow(0 18px 40px rgba(85, 99, 224, .45)); }
  .text { position: relative; }
  .eyebrow { font: 700 15px 'JetBrains Mono', monospace; letter-spacing: 3px; color: #7B8CFF; margin-bottom: 14px; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }
  p { margin-top: 16px; font-size: 21px; color: #A6B2C4; line-height: 1.5; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { padding: 7px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: #C9D1FF;
          background: rgba(123, 140, 255, .12); border: 1px solid rgba(123, 140, 255, .35); }
</style></head>
<body><div class="banner">
  <div class="grid"></div>
  <svg class="candles" width="520" height="300" viewBox="0 0 520 300" fill="#7B8CFF">
    <rect x="10" y="190" width="18" height="70"/><rect x="18" y="170" width="2" height="110"/>
    <rect x="50" y="160" width="18" height="60"/><rect x="58" y="140" width="2" height="100"/>

    <rect x="130" y="130" width="18" height="70"/><rect x="138" y="110" width="2" height="110"/>

  <div class="text">
    <div class="eyebrow">WALLETTRACK</div>
    <h1>고래 지갑 추적기</h1>
    <p>비트코인 고래의 매수·매도, 김치 프리미엄, 강제청산을<br>한 화면에서 실시간으로</p>
    <div class="chips"><span class="chip">5개 거래소 대형 체결</span><span class="chip">업비트 원화 마켓 전체</span><span class="chip">온체인 고래 이동</span></div>
  </div>
</div></body></html>
