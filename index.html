<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Realtime Live Stream</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="background-glow"></div>

  <div class="app-container">
    <!-- Minimalist Bitcoin Price Banner -->
    <header class="price-header glass-panel">
      <div class="price-box">
        <div class="price-label-row">
          <span class="price-label">BTC / USD</span>
          <span id="price-live-badge" class="price-live-badge"><span class="badge-dot"></span>LIVE</span>
        </div>
        <h1 id="live-btc-price" class="main-btc-price">$00,000.00</h1>
      </div>
      <div id="ws-status-dot" class="dot pulsing green hidden-dot"></div>
      <span id="ws-status-text" class="hidden-txt"></span>
    </header>

    <!-- Controls & Filter Bar -->
    <div class="control-bar glass-panel">
      <div class="control-left">
        <span class="filter-label">거래량 필터:</span>
        <button class="threshold-btn active" data-threshold="0.1">≥ 0.1 BTC (초고속)</button>
        <button class="threshold-btn" data-threshold="0.5">≥ 0.5 BTC</button>
        <button class="threshold-btn" data-threshold="1.0">≥ 1.0 BTC</button>
        <button class="threshold-btn whale-filter" data-threshold="3.0">🐋 ≥ 3.0 BTC (고래전용)</button>
      </div>

      <div class="control-right">
        <span id="live-tx-count" class="count-tag">0 건 감지</span>
        <span class="vol-label">누적 거래량: <strong id="live-total-vol">0.00 BTC</strong></span>
      </div>
    </div>

    <!-- Main Live Stream Container -->
    <main class="stream-section">
      <div id="live-tx-feed" class="live-feed-list">
        <div class="empty-feed">
          <div class="loading-spinner"></div>
          <p>비트코인 블록체인 실시간 거래 수신 중...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initLiveStreamDashboard } from '/src/btcWhaleTracker.ts';
    document.addEventListener('DOMContentLoaded', () => {
      initLiveStreamDashboard();
    });
  </script>
</body>
</html>
